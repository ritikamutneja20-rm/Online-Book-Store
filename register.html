<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Online Book Store</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar">

            <div class="logo">
                📚 Online Book Store
            </div>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="catalogue.html">Books</a>
                <a href="cart.html">Cart 🛒</a>
                <a href="login.html">Login</a>
                <a href="register.html" class="register-btn">
                    Register
                </a>
                <a href="wishlist.html">Wishlist ❤️</a>
                <button class="theme-btn" onclick="toggleDarkMode()" title="Toggle dark mode">
    🌙
</button>
            </div>

        </nav>
    </header>


    <!-- Register Section -->
    <section class="auth-section">

        <div class="auth-container">

            <div class="auth-icon">
                👤
            </div>

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Join Online Book Store and start exploring books.
            </p>


            <form id="registerForm" onsubmit="registerUser(event)">

                <!-- Full Name -->
                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >


                <!-- Email -->
                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <!-- Password -->
                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >


                <!-- Confirm Password -->
                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >


                <!-- Department -->
                <label for="department">
                    Department
                </label>

                <select id="department" required>

                    <option value="">
                        Select Department
                    </option>

                    <option value="IT">
                        Information Technology
                    </option>

                    <option value="CSE">
                        Computer Science
                    </option>

                    <option value="ECE">
                        Electronics & Communication
                    </option>

                    <option value="ME">
                        Mechanical Engineering
                    </option>

                    <option value="CE">
                        Civil Engineering
                    </option>

                </select>


                <!-- Terms -->
                <div class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <label for="terms">
                        I agree to the terms and conditions
                    </label>

                </div>


                <!-- Register Button -->
                <button
                    type="submit"
                    class="auth-btn"
                >
                    Create Account
                </button>

            </form>


            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

        </div>

    </section>


    <footer>
        <p>© Online Book Store</p>
    </footer>


    <script src="js/script.js"></script>

</body>
</html>
