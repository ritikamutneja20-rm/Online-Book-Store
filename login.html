<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Online Book Store</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar">

            <div class="logo">
                📚 Online Book Store
            </div>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="catalogue.html">Books</a>
                <a href="cart.html">Cart 🛒</a>
                <a href="login.html">Login</a>
                <a href="register.html" class="register-btn">
                    Register
                </a>
                <a href="wishlist.html">Wishlist ❤️</a>
                <button class="theme-btn" onclick="toggleDarkMode()" title="Toggle dark mode">
    🌙
</button>
            </div>

        </nav>
    </header>


    <!-- Login Section -->
    <section class="auth-section">

        <div class="auth-container">

            <div class="auth-icon">
                🔐
            </div>

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Login to continue shopping for your favorite books.
            </p>


            <form id="loginForm" onsubmit="loginUser(event)">

                <label for="loginEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >


                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Login
                </button>

            </form>


            <p class="auth-switch">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

        </div>

    </section>


    <footer>
        <p>© Online Book store</p>
    </footer>


    <script src="js/script.js"></script>

</body>
</html>
